[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boreas-core"
version = "0.1.0"
description = "BOREAS decision-support core: physics-informed drift, uncertainty, routing, explainability, and edge deployment for Antarctic operations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "shap>=0.45",
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    "torch>=2.2",
    "onnx>=1.16",
    "onnxruntime>=1.17",
    "onnxscript>=0.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "matplotlib>=3.8",
    "httpx>=0.27",
    "polar-route>=1.1.11",
    "copernicusmarine>=2.0.0",
    "pillow>=10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["boreas_core"]

[tool.uv.sources]
# This box has no GPU, so pull CPU-only torch wheels -- a few hundred MB
# instead of several GB of bundled CUDA/cuDNN/NCCL we could never use.
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
